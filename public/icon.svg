<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: #2563EB; }
      .foreground { fill: white; }
      .accent { fill: #0D9488; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: #1E293B; }
      .foreground { fill: white; }
      .accent { fill: #0D9488; }
    }
  </style>
  <rect class="background" width="180" height="180" rx="32" />
  
  <!-- Stethoscope -->
  <g transform="translate(90,90)">
    <!-- Main tube -->
    <path class="foreground" d="M-35,-25 Q-35,-35 -25,-35 L25,-35 Q35,-35 35,-25 L35,15 Q35,25 25,25 L15,25" 
          stroke-width="8" fill="none" stroke="currentColor"/>
    
    <!-- Left earpiece -->
    <circle class="foreground" cx="-25" cy="-35" r="6"/>
    
    <!-- Right earpiece -->  
    <circle class="foreground" cx="25" cy="-35" r="6"/>
    
    <!-- Chest piece (main circle) -->
    <circle class="accent" cx="15" cy="25" r="15"/>
    <circle class="background" cx="15" cy="25" r="8"/>
    
    <!-- Small connecting tube -->
    <rect class="foreground" x="13" y="25" width="4" height="15"/>
    
    <!-- Diaphragm -->
    <circle class="foreground" cx="15" cy="45" r="8"/>
    <circle class="background" cx="15" cy="45" r="5"/>
    
    <!-- Cross symbol for medical -->
    <rect class="accent" x="12" y="42" width="6" height="2"/>
    <rect class="accent" x="14" y="40" width="2" height="6"/>
  </g>
</svg>